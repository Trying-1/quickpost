name: quickpost
description: Create stunning social posts, crop images in bulk, and make videos easily.
publish_to: 'none'

version: 1.0.19+25

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  image: ^4.1.3
  device_info_plus: ^9.1.1
  video_player: ^2.8.1
  open_file: ^3.3.2
  file_picker: ^8.0.0
  csv: ^6.0.0
  intl: ^0.18.1
  archive: ^3.6.1

  # Firebase
  firebase_core: ^3.11.0
  firebase_analytics: ^11.4.1
  
  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Video thumbnail
  get_thumbnail_video: ^0.7.3
  # In-app updates and reviews
  in_app_update: ^4.2.3
  in_app_review: ^2.0.9

  # Profile & Settings
  package_info_plus: ^4.0.0
  url_launcher: ^6.1.0
  share_plus: ^12.0.1
  uuid: ^4.5.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  in_app_purchase: ^3.3.0
  google_mobile_ads: ^5.1.0
  toastification: ^3.0.3
  image_cropper: ^12.2.1
  widget_mask: ^1.0.0+0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/app_icon_foreground.png
    - assets/fonts/
  fonts:
    - family: Bokor
      fonts:
        - asset: assets/fonts/Bokor-Regular.ttf
    - family: BungeeHairline
      fonts:
        - asset: assets/fonts/BungeeHairline-Regular.ttf
    - family: Caramel
      fonts:
        - asset: assets/fonts/Caramel-Regular.ttf
    - family: Explora
      fonts:
        - asset: assets/fonts/Explora-Regular.ttf
    - family: GrandifloraOne
      fonts:
        - asset: assets/fonts/GrandifloraOne-Regular.ttf
    - family: KleeOne
      fonts:
        - asset: assets/fonts/KleeOne-SemiBold.ttf
    - family: Lacquer
      fonts:
        - asset: assets/fonts/Lacquer-Regular.ttf
    - family: LibreBarcode39Text
      fonts:
        - asset: assets/fonts/LibreBarcode39Text-Regular.ttf
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: MajorMonoDisplay
      fonts:
        - asset: assets/fonts/MajorMonoDisplay-Regular.ttf
    - family: Metrophobic
      fonts:
        - asset: assets/fonts/Metrophobic-Regular.ttf
    - family: Michroma
      fonts:
        - asset: assets/fonts/Michroma-Regular.ttf
    - family: NewRocker
      fonts:
        - asset: assets/fonts/NewRocker-Regular.ttf
    - family: NewTegomin
      fonts:
        - asset: assets/fonts/NewTegomin-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Poppins-Bold
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
    - family: Poppins-Black
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
    - family: Poppins-Light
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
    - family: Poppins-Medium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
    - family: Poppins-SemiBold
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
    - family: Poppins-Thin
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
    - family: Poppins-ExtraLight
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
    - family: Poppins-ExtraBold
      fonts:
        - asset: assets/fonts/Poppins-ExtraBold.ttf
    - family: Poppins-Italic
      fonts:
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
    - family: ProtestRevolution
      fonts:
        - asset: assets/fonts/ProtestRevolution-Regular.ttf
    - family: SourGummy
      fonts:
        - asset: assets/fonts/SourGummy-VariableFont_wdth,wght.ttf
    - family: KodeMono
      fonts:
        - asset: assets/fonts/KodeMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
