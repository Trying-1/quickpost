name: quickpost
description: Create stunning social posts, crop images in bulk, and make videos easily.
publish_to: 'none'

version: 1.0.17+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  image: ^4.1.3
  device_info_plus: ^9.1.1
  video_player: ^2.8.1
  open_file: ^3.3.2
  file_picker: ^8.0.0
  csv: ^6.0.0
  intl: ^0.18.1
  archive: ^3.6.1

  # Firebase
  firebase_core: ^3.11.0
  firebase_analytics: ^11.4.1
  
  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Video thumbnail
  video_thumbnail: ^0.5.3
  
  # In-app updates and reviews
  in_app_update: ^4.2.3
  in_app_review: ^2.0.9

  # Profile & Settings
  package_info_plus: ^4.0.0
  url_launcher: ^6.1.0
  share_plus: ^12.0.1
  uuid: ^4.5.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  in_app_purchase: ^3.3.0
  google_mobile_ads: ^5.1.0
  toastification: ^3.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/post_template_images/qp_preview1.jpeg
